ai_log_analysis.analysis:
  path: '/admin/reports/ai-log-analysis'
  defaults:
    _controller: '\Drupal\ai_log_analysis\Controller\LogAnalysisController::analyze'
    _title: 'AI Log Analysis'
  requirements:
    _permission: 'administer site configuration'

grok_settings_form:
  path: '/admin/config/development/grok-ai'
  defaults:
    _form: '\Drupal\ai_log_analysis\Form\GrokSettingsForm'
    _title: 'Grok AI Settings'
  requirements:
    _permission: 'administer site configuration'
    
ai_log_analysis.fix_single:
  path: '/admin/reports/ai-log-fix'
  defaults:
    _form: '\Drupal\ai_log_analysis\Form\ErrorFixForm'
    _title: 'Fix Single Log Error'
  requirements:
    _permission: 'administer site configuration'

ai_log_analysis.logs:
  path: '/ai-log-analysis/logs'
  defaults:
    _controller: '\Drupal\ai_log_analysis\Controller\LogController::logsPage'
    _title: 'Log Analyzer'
  requirements:
    _permission: 'access administration pages'

ai_log_analysis.analyze:
  path: '/ai-log-analysis/analyze/{key}'
  defaults:
    _controller: '\Drupal\ai_log_analysis\Controller\LogController::analyze'
  requirements:
    _permission: 'access administration pages'
