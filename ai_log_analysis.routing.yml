ai_log_analysis.settings:
  path: '/admin/config/system/ai-log-analysis'
  defaults:
    _form: '\Drupal\ai_log_analysis\Form\LogAnalysisSettingsForm'
    _title: 'AI Log Analysis Settings'
  requirements:
    _permission: 'administer site configuration'

ai_log_analysis.logs:
  path: '/ai-log-analysis/logs'
  defaults:
    _controller: '\Drupal\ai_log_analysis\Controller\LogController::logsPage'
    _title: 'Log Analyzer'
  requirements:
    _permission: 'access administration pages'

ai_log_analysis.analyze:
  path: '/ai-log-analysis/analyze/{key}'
  defaults:
    _controller: '\Drupal\ai_log_analysis\Controller\LogController::analyze'
  requirements:
    _permission: 'access administration pages'
